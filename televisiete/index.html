<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Televisiete Guatemala</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: black;
      overflow: hidden;
    }

    video {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: black;
      object-fit: cover;
    }
  </style>
</head>

<body>
  <video id="video" autoplay controls playsinline></video>

  <script>
    const video = document.getElementById("video");

    video.src = "https://guastream.com/play/tr_PLpGQrHUnzsCY6isDwAyTL_DIq-6HQVpFodFh2tQ/m3u8";

    async function startPlayback() {
      try {
        video.muted = false;
        await video.play();
      } catch (error) {}

      try {
        if (!document.fullscreenElement) {
          await document.documentElement.requestFullscreen();
        }
      } catch (error) {}
    }

    window.addEventListener("load", function () {
      video.play().catch(function () {});
    });

    document.addEventListener("click", startPlayback);
    document.addEventListener("keydown", function (event) {
      if (event.key === "Enter" || event.key === " ") {
        startPlayback();
      }
    });
  </script>
</body>
</html>
