<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Telemundo</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: black;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    iframe {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      border: none;
      background: black;
    }

    .start-screen {
      position: fixed;
      inset: 0;
      z-index: 10;
      background: radial-gradient(circle at center, #111 0%, #000 70%);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .start-box {
      padding: 28px 36px;
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 18px;
      background: rgba(255,255,255,0.06);
      box-shadow: 0 12px 40px rgba(0,0,0,0.55);
    }

    .start-box h1 {
      margin: 0 0 12px;
      font-size: 34px;
    }

    .start-box p {
      margin: 0 0 22px;
      color: #cfcfcf;
      font-size: 18px;
    }

    .start-button {
      border: none;
      background: #00bcd4;
      color: black;
      font-size: 18px;
      font-weight: bold;
      padding: 14px 28px;
      border-radius: 12px;
      cursor: pointer;
    }

    .start-button:focus {
      outline: 3px solid white;
      outline-offset: 4px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>
  <div id="startScreen" class="start-screen">
    <div class="start-box">
      <h1>Telemundo</h1>
      <p>Presionar OK / Enter para iniciar</p>
      <button id="startButton" class="start-button" autofocus>
        ▶ Start
      </button>
    </div>
  </div>

  <iframe
    id="playerFrame"
    title="Telemundo"
    allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
    allowfullscreen>
  </iframe>

  <script>
    const startScreen = document.getElementById("startScreen");
    const startButton = document.getElementById("startButton");
    const playerFrame = document.getElementById("playerFrame");

    const streamPage = "https://dlhd.pk/watch/stream-131.php";

    let started = false;

    async function startPlayer() {
      if (started) return;
      started = true;

      playerFrame.src = streamPage;
      startScreen.classList.add("hidden");

      try {
        if (!document.fullscreenElement) {
          await document.documentElement.requestFullscreen();
        }
      } catch (error) {}
    }

    startButton.addEventListener("click", startPlayer);

    document.addEventListener("keydown", function(event) {
      if (
        event.key === "Enter" ||
        event.key === " " ||
        event.key === "MediaPlayPause" ||
        event.key === "Select"
      ) {
        startPlayer();
      }
    });

    window.addEventListener("load", function() {
      startButton.focus();
    });
  </script>
</body>
</html>
