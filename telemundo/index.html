<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Telemundo</title>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: black;
      overflow: hidden;
    }

    video {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: black;
      object-fit: cover;
    }
  </style>
</head>

<body>
  <video id="video" autoplay controls playsinline></video>

  <script>
    const video = document.getElementById("video");

    const streamUrl = "https://d1rqgw5gocwo9i.cloudfront.net/manifest/3fec3e5cac39a52b2132f9c66c83dae043dc17d4/prod_default_xumo-nbcu-stitched/10a44c37-f976-4d2b-ab23-8637a7a094ca/3.m3u8";

    function loadVideo() {
      if (Hls.isSupported()) {
        const hls = new Hls({
          enableWorker: true,
          lowLatencyMode: true
        });

        hls.loadSource(streamUrl);
        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED, function () {
          video.play().catch(function () {});
        });
      } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
        video.src = streamUrl;
        video.addEventListener("loadedmetadata", function () {
          video.play().catch(function () {});
        });
      } else {
        video.src = streamUrl;
      }
    }

    async function startPlayback() {
      try {
        video.muted = false;
        await video.play();
      } catch (error) {}

      try {
        if (!document.fullscreenElement) {
          await document.documentElement.requestFullscreen();
        }
      } catch (error) {}
    }

    window.addEventListener("load", loadVideo);

    document.addEventListener("click", startPlayback);
    document.addEventListener("keydown", function (event) {
      if (event.key === "Enter" || event.key === " ") {
        startPlayback();
      }
    });
  </script>
</body>
</html>
