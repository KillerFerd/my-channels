<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Telemundo</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: black;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    .player-wrapper {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: black;
      overflow: hidden;
    }

    iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      background: black;
    }

    .controls {
      position: fixed;
      left: 12px;
      bottom: 12px;
      z-index: 10;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      background: rgba(0, 0, 0, 0.65);
      padding: 8px;
      border-radius: 10px;
      backdrop-filter: blur(8px);
    }

    .controls button {
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: rgba(255, 255, 255, 0.1);
      color: white;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
    }

    .controls button:hover {
      background: rgba(255, 255, 255, 0.22);
    }

    .controls button.active {
      background: #00bcd4;
      border-color: #00bcd4;
      color: black;
    }

    .hide-controls {
      position: fixed;
      right: 12px;
      bottom: 12px;
      z-index: 11;
      border: none;
      background: rgba(0, 0, 0, 0.65);
      color: white;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      backdrop-filter: blur(8px);
    }

    body.controls-hidden .controls,
    body.controls-hidden .hide-controls {
      display: none;
    }
  </style>
</head>

<body>
  <div class="player-wrapper">
    <iframe
      id="playerFrame"
      src="https://guzesqdro.pinme.dev"
      title="Telemundo"
      allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
      allowfullscreen>
    </iframe>
  </div>

  <div class="controls" id="controls">
    <button class="active" data-url="https://guzesqdro.pinme.dev">TVFreedom Player</button>
    <button data-url="https://dlhd.pk/watch.php?id=131">DLHD Watch</button>
    <button data-url="https://dlhd.pk/stream/stream-131.php">Player 1</button>
    <button data-url="https://dlhd.pk/cast/stream-131.php">Player 2</button>
    <button data-url="https://dlhd.pk/watch/stream-131.php">Player 3</button>
    <button data-url="https://dlhd.pk/plus/stream-131.php">Player 4</button>
    <button data-url="https://dlhd.pk/casting/stream-131.php">Player 5</button>
    <button data-url="https://dlhd.pk/player/stream-131.php">Player 6</button>
  </div>

  <button class="hide-controls" id="hideControls">Hide controls</button>

  <script>
    const iframe = document.getElementById("playerFrame");
    const buttons = document.querySelectorAll(".controls button");
    const hideControls = document.getElementById("hideControls");

    buttons.forEach(function (button) {
      button.addEventListener("click", function () {
        const url = button.getAttribute("data-url");

        if (!url) return;

        iframe.src = url;

        buttons.forEach(function (btn) {
          btn.classList.remove("active");
        });

        button.classList.add("active");
      });
    });

    hideControls.addEventListener("click", function () {
      document.body.classList.add("controls-hidden");
    });

    document.addEventListener("keydown", function (event) {
      if (event.key.toLowerCase() === "h") {
        document.body.classList.toggle("controls-hidden");
      }

      if (event.key === "f" || event.key === "F11") {
        try {
          if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen();
          }
        } catch (error) {}
      }
    });

    document.addEventListener("dblclick", function () {
      try {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen();
        } else {
          document.exitFullscreen();
        }
      } catch (error) {}
    });
  </script>
</body>
</html>
